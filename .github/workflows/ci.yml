name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # Windows sparse checkout: the Plan 9 source tree contains paths with
    # Windows-reserved names (for example 386/bin/aux/, plus other aux/con/nul
    # entries) that can make checkout fail before build or test steps run.
    # Use non-cone sparse checkout so only the explicit C library paths below
    # are materialized in the worktree on Windows.
    - name: Checkout (Windows – non-cone sparse checkout)
      if: matrix.os == 'windows-latest'
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          /CMakeLists.txt
          /src/
          /include/
          /tests/
        sparse-checkout-cone-mode: false
        fetch-depth: 1

    - name: Checkout (Linux / macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --config Debug

    - name: Run Unit Tests (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ./build/tests/unit/test_atomspace
        ./build/tests/unit/test_pln

    - name: Run Unit Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\build\tests\unit\Debug\test_atomspace.exe
        .\build\tests\unit\Debug\test_pln.exe

    - name: Run Comprehensive Unit Tests (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ./build/tests/unit/test_atomspace_comprehensive
        ./build/tests/unit/test_pln_comprehensive
        ./build/tests/unit/test_edge_cases
        ./build/tests/unit/test_stress

    - name: Run Comprehensive Unit Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\build\tests\unit\Debug\test_atomspace_comprehensive.exe
        .\build\tests\unit\Debug\test_pln_comprehensive.exe
        .\build\tests\unit\Debug\test_edge_cases.exe
        .\build\tests\unit\Debug\test_stress.exe

    - name: Run API Tests (Unix)
      if: matrix.os != 'windows-latest'
      run: ./build/tests/api/test_plan9cog_api

    - name: Run API Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: .\build\tests\api\Debug\test_plan9cog_api.exe

    - name: Run Integration Tests (Unix)
      if: matrix.os != 'windows-latest'
      run: ./build/tests/integration/test_integration

    - name: Run Integration Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: .\build\tests\integration\Debug\test_integration.exe

    - name: Run Phase 2E Shell Integration Tests
      if: matrix.os != 'windows-latest'
      run: |
        chmod +x tests/integration/run_integration_tests.sh
        chmod +x tests/integration/test_coginfo_stats.sh
        chmod +x tests/integration/test_atomspace_persistence.sh
        chmod +x tests/integration/test_pln_stats.sh
        chmod +x tests/integration/test_benchmark.sh
        ./tests/integration/run_integration_tests.sh

    - name: Run Phase 2E Shell Integration Tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: bash tests/integration/run_integration_tests.sh

    - name: Run CLI Tests
      if: matrix.os != 'windows-latest'
      run: |
        chmod +x tests/cli/test_cogctl.sh
        chmod +x tests/cli/test_cogfs.sh
        ./tests/cli/test_cogctl.sh
        ./tests/cli/test_cogfs.sh

    - name: Run CLI Tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        bash tests/cli/test_cogctl.sh
        bash tests/cli/test_cogfs.sh

    - name: Run E2E Tests
      if: matrix.os != 'windows-latest'
      run: |
        chmod +x tests/e2e/test_full_workflow.sh
        ./tests/e2e/test_full_workflow.sh

    - name: Run E2E Tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: bash tests/e2e/test_full_workflow.sh
