name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --config Debug

    - name: Run Unit Tests
      run: |
        ./build/tests/unit/test_atomspace
        ./build/tests/unit/test_pln

    - name: Run Comprehensive Unit Tests
      run: |
        ./build/tests/unit/test_atomspace_comprehensive
        ./build/tests/unit/test_pln_comprehensive
        ./build/tests/unit/test_edge_cases
        ./build/tests/unit/test_stress

    - name: Run API Tests
      run: ./build/tests/api/test_plan9cog_api

    - name: Run CLI Tests
      run: |
        chmod +x tests/cli/test_cogctl.sh
        chmod +x tests/cli/test_cogfs.sh
        ./tests/cli/test_cogctl.sh
        ./tests/cli/test_cogfs.sh

    - name: Run E2E Tests
      run: |
        chmod +x tests/e2e/test_full_workflow.sh
        ./tests/e2e/test_full_workflow.sh
