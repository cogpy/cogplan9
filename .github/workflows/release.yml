name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*e-*'

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cogplan9-linux-x64
            asset_name: cogplan9-linux-x64.tar.gz
          - os: macos-latest
            artifact_name: cogplan9-macos-x64
            asset_name: cogplan9-macos-x64.tar.gz
          - os: windows-latest
            artifact_name: cogplan9-windows-x64
            asset_name: cogplan9-windows-x64.zip

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Release Artifacts (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p release/${{ matrix.artifact_name }}
        cp build/sys/cmd/cogctl/cogctl release/${{ matrix.artifact_name }}/
        cp build/sys/cmd/cogfs/cogfs release/${{ matrix.artifact_name }}/
        tar -czvf ${{ matrix.asset_name }} -C release .

    - name: Prepare Release Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir -p release/${{ matrix.artifact_name }}
        cp build/sys/cmd/cogctl/Release/cogctl.exe release/${{ matrix.artifact_name }}/
        cp build/sys/cmd/cogfs/Release/cogfs.exe release/${{ matrix.artifact_name }}/
        7z a ${{ matrix.asset_name }} .\release\*

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ matrix.asset_name }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/gzip
